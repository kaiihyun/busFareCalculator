<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RTMI Fare System</title>
        <link rel="stylesheet" href="rtmistyle.css">
    </head>
    <body>
        <div id="headSection"> 
            <h1>The Wheels on the BUS</h1>
            <h1>Go Round and Round</h1>
            <h2>Fare Calculator</h2>
            <p>Calculates your bus fare one place to another.</p>

        </div>


        <fieldset>
            <legend>Bus type</legend>
            <input name="busType" id="ordinary" type="radio" value="ordinary" checked>
            <label for="ordinary">Ordinary Bus</label><br/>
            
            <input name="busType" id="airconditioned" type="radio" value="airconditioned">
            <label for="airconditioned">Air-Conditioned</label><br/>

            <input name="busType" id="deluxe" type="radio" value="deluxe">
            <label for="deluxe">Deluxe</label><br/>
        </fieldset>



        <fieldset>
            <legend>Ticket Maker</legend>
    
            <p id="rateDisplay">RATE 2.25 per km</p>
            <label for="startLocation">Starting Location</label>
            <input id="startLocation" type="text" placeholder="Iligan City">
            <br/>
            <label for="endLocation">Destination</label>
            <input id="endLocation" type="text" placeholder="Rupagan">
            <br/><br/>

          
            <input name="fareType" id="regular" type="radio" value="regular" checked>
            <label for="regular">Regular</label><br/>
            
            <input name="fareType" id="student" type="radio" value="sp">
            <label for="student">Student / Senior Citizen / PwD</label><br/>

 
            <br/>
            <input type="submit" value="Submit" onclick="CalculateFare()">
        
        </fieldset>
    
        <fieldset id="fareDisplayArea">
            <legend>FARE</legend>
               <p id="displayFare"></p>
        </fieldset>

        <fieldset id="suggestionField">
            <legend>Suggestions</legend>
               <div id="suggestions"></div>   
        </fieldset>
 
    
    </body>
    <script src="rtmiscript.js"> </script>
        
   
</html>
